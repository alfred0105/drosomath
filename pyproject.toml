[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drosomath"
version = "0.1.0"
description = "Experimental Drosophila-connectome spiking learning platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
drosomath-demo = "drosomath.demo:main"
drosomath-memory-demo = "drosomath.memory_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
