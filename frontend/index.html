<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <title>DrosoMath</title>
  </head>
  <body>
    <div id="app">
      <canvas id="brain"></canvas>
      <section class="hud" aria-label="DrosoMath telemetry">
        <div>
          <span class="label">Problem</span>
          <strong id="problem">connecting…</strong>
        </div>
        <div>
          <span class="label">Answer</span>
          <strong id="answer">—</strong>
        </div>
        <div>
          <span class="label">Trial</span>
          <strong id="trial">—</strong>
        </div>
        <div>
          <span class="label">Plastic synapses</span>
          <strong id="plasticity">—</strong>
        </div>

        <div class="success-panel">
          <span class="label">Success rates</span>
          <div class="success-grid">
            <div class="success-stat">
              <span>Overall</span>
              <strong id="accuracy-overall">—</strong>
              <small id="accuracy-count">0 / 0</small>
            </div>
            <div class="success-stat">
              <span>Last 20</span>
              <strong id="accuracy-20">—</strong>
            </div>
            <div class="success-stat">
              <span>Last 100</span>
              <strong id="accuracy-100">—</strong>
            </div>
            <div class="success-stat">
              <span>Last 500</span>
              <strong id="accuracy-500">—</strong>
            </div>
          </div>
        </div>
      </section>
      <div class="status" id="status">loading layout…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
