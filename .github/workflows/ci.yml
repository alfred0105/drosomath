name: DrosoMath CI

on:
  push:
    branches:
      - main
      - bootstrap/realtime-3d
    paths-ignore:
      - 'runs/**'

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\run.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "run.ps1 syntax OK"
      - name: Run launcher self-test
        shell: powershell
        run: .\run.ps1 -SelfTest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Import active FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Stage 3S symbolic arithmetic smoke test
        working-directory: backend
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np
          from app.symbolic_stage3s import (
              ADDITION_COMMUTATIVITY_PAIRS,
              ADDITION_HELD_OUT_PAIRS,
              ADDITION_TRAIN_PAIRS,
              ALL_TOKENS,
              HELD_OUT_UNORDERED_PAIRS,
              N_OUTPUTS,
              SymbolicStage3SExperiment,
          )

          exp = SymbolicStage3SExperiment()
          cfg = exp.config_dict()
          enc = cfg['token_encoding']
          assert enc['scalar_number_value_injected'] is False
          assert enc['ordinal_embedding_injected'] is False
          assert enc['sum_feature_injected'] is False
          assert enc['distance_to_answer_injected'] is False
          assert len(exp.token_codes) == len(ALL_TOKENS)
          assert all(int(np.count_nonzero(code)) == exp.config.token_active for code in exp.token_codes.values())
          assert len({code.tobytes() for code in exp.token_codes.values()}) == len(ALL_TOKENS)

          train_unordered = {tuple(sorted(pair)) for pair in ADDITION_TRAIN_PAIRS}
          comm_unordered = {tuple(sorted(pair)) for pair in ADDITION_COMMUTATIVITY_PAIRS}
          held_unordered = {tuple(sorted(pair)) for pair in ADDITION_HELD_OUT_PAIRS}
          assert train_unordered.isdisjoint(held_unordered)
          assert held_unordered == HELD_OUT_UNORDERED_PAIRS
          assert comm_unordered.issubset(train_unordered)
          assert {a + b for a, b in ADDITION_TRAIN_PAIRS} == set(range(N_OUTPUTS))

          trial = 1
          for task in ('identity', 'successor', 'addition'):
              for _ in range(60):
                  result = exp.step(
                      trial,
                      task=task,
                      pair_pool=ADDITION_TRAIN_PAIRS if task == 'addition' else None,
                  )
                  trial += 1
                  assert 0 <= result['target'] < N_OUTPUTS
                  assert 0 <= result['choice'] < N_OUTPUTS
                  assert len(result['policy']['top']) == 5
                  assert result['plasticity']['active_synapses'] > 0

          before_w = exp.w_output.copy()
          before_b = exp.output_bias.copy()
          for pool in (ADDITION_TRAIN_PAIRS, ADDITION_COMMUTATIVITY_PAIRS, ADDITION_HELD_OUT_PAIRS):
              for a, b in pool[:8]:
                  result = exp.step(trial, task='addition', a=a, b=b, learn=False, trial_kind='frozen')
                  trial += 1
                  assert result['learning_enabled'] is False
                  assert result['target'] == a + b
                  assert result['plasticity']['active_synapses'] == 0
          assert np.array_equal(before_w, exp.w_output)
          assert np.array_equal(before_b, exp.output_bias)

          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'stage3s.npz'
              exp.save_checkpoint(path, {'trial': trial, 'stage': '3S'})
              restored = SymbolicStage3SExperiment()
              meta = restored.load_checkpoint(path)
              assert meta['trial'] == trial
              assert meta['stage'] == '3S'
              assert np.array_equal(exp.w_input, restored.w_input)
              assert np.array_equal(exp.w_output, restored.w_output)
              assert np.array_equal(exp.output_bias, restored.output_bias)

          print('Stage 3S symbolic arithmetic smoke test passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
