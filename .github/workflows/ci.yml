name: DrosoMath CI

on:
  push:
    branches: [main, bootstrap/realtime-3d, feature/dual-brain-v2]
    paths-ignore: ['runs/**']

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\run.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "run.ps1 syntax OK"
      - name: Run launcher self-test
        shell: powershell
        run: .\run.ps1 -SelfTest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Import active FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Stage 3S.3 operator-transition smoke test
        working-directory: backend
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          from app.symbolic_stage3s3 import (
              ADDITION_HELDOUT_PAIRS, ADDITION_REVERSE_TEST_PAIRS, ADDITION_TRAIN_PAIRS,
              NEXT2_HELDOUT_STARTS, NEXT2_TRAIN_STARTS, PREV2_HELDOUT_STARTS, PREV2_TRAIN_STARTS,
              SymbolicStage3S3Experiment,
          )
          from app.stage3s3_curriculum import TRAIN_TRIALS, TRAINING_MILESTONES

          exp = SymbolicStage3S3Experiment()
          cfg = exp.config_dict()
          enc = cfg['token_encoding']
          assert cfg['stage'] == '3S.3'
          assert TRAIN_TRIALS == 600_000
          assert TRAINING_MILESTONES[-1] == 600_000
          assert enc['scalar_number_value_injected'] is False
          assert enc['ordinal_embedding_injected'] is False
          assert enc['sum_feature_injected'] is False
          assert cfg['operator_architecture']['numeric_transition_hardcoded'] is False
          assert set(NEXT2_TRAIN_STARTS).isdisjoint(NEXT2_HELDOUT_STARTS)
          assert set(PREV2_TRAIN_STARTS).isdisjoint(PREV2_HELDOUT_STARTS)

          tokens, target, _ = exp.task_example('guided_next3', a=2)
          assert tokens == ['2', 'NEXT', '3', 'NEXT', '4', 'NEXT'] and target == 5
          tokens, target, _ = exp.task_example('prev2', a=7)
          assert tokens == ['7', 'PREV', 'PREV'] and target == 5

          before_next = exp.w_next.copy(); before_prev = exp.w_prev.copy()
          for trial in range(1, 101):
              task = 'next' if trial % 2 else 'prev'
              result = exp.step(trial, task=task, token_plasticity_scale=.2, recurrent_plasticity_scale=.2, operator_plasticity_scale=1.0)
              assert result['active_output_count'] == 10
          assert not np.array_equal(before_next, exp.w_next)
          assert not np.array_equal(before_prev, exp.w_prev)

          train_u = {tuple(sorted(p)) for p in ADDITION_TRAIN_PAIRS}
          held_u = {tuple(sorted(p)) for p in ADDITION_HELDOUT_PAIRS}
          assert train_u.isdisjoint(held_u)
          for a, b in ADDITION_REVERSE_TEST_PAIRS:
              assert (a, b) not in ADDITION_TRAIN_PAIRS and (b, a) in ADDITION_TRAIN_PAIRS

          before = tuple(x.copy() for x in (exp.w_token, exp.w_rec, exp.w_next, exp.w_prev, exp.w_output, exp.output_bias))
          exp.step(101, task='next2', a=NEXT2_HELDOUT_STARTS[0], learn=False)
          exp.step(102, task='addition', a=ADDITION_HELDOUT_PAIRS[0][0], b=ADDITION_HELDOUT_PAIRS[0][1], learn=False)
          after = (exp.w_token, exp.w_rec, exp.w_next, exp.w_prev, exp.w_output, exp.output_bias)
          assert all(np.array_equal(a, b) for a, b in zip(before, after))

          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 's3s3.npz'
              exp.save_checkpoint(path, {'stage':'3S.3'})
              restored = SymbolicStage3S3Experiment(); meta = restored.load_checkpoint(path)
              assert meta['stage'] == '3S.3'
              assert np.array_equal(exp.w_next, restored.w_next)
              assert np.array_equal(exp.w_prev, restored.w_prev)
          print('Stage 3S.3 smoke test passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
