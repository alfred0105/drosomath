name: DrosoMath CI

on:
  push:
    branches:
      - main
      - bootstrap/realtime-3d
    paths-ignore:
      - 'runs/**'

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\run.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "run.ps1 syntax OK"
      - name: Run launcher self-test
        shell: powershell
        run: .\run.ps1 -SelfTest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Import active FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Stage 2.2D brightness curriculum smoke test
        working-directory: backend
        run: |
          python - <<'PY'
          import math
          import tempfile
          from pathlib import Path

          import numpy as np
          from app.numerosity_stage22d import (
              STAGE22D_PROFILES,
              STAGE22D_TRAIN_PROFILES,
              Stage22DExperiment,
          )

          exp = Stage22DExperiment()

          retina = np.zeros((exp.config.grid_size, exp.config.grid_size), dtype=np.float32)
          retina[5, 5] = 0.7
          retina[7, 8] = 0.3
          processed = exp._preprocess_retina(retina)
          assert processed.shape == retina.shape
          assert np.all(np.isfinite(processed))
          assert np.all(processed >= 0)
          assert math.isclose(float(processed.sum()), float(retina.sum()), rel_tol=1e-5, abs_tol=1e-5)

          phase_ratios = {}
          trial = 1
          for profile in STAGE22D_TRAIN_PROFILES:
              ratios = []
              seen_close = False
              for _ in range(180):
                  result = exp.step(trial, stimulus_profile=profile)
                  trial += 1
                  controls = result['stimulus']['controls']
                  assert controls['stimulus_profile'] == profile
                  assert controls['curriculum'] == 'stage2_2d_progressive_brightness'
                  assert controls['progressive_brightness_training'] is True
                  if result['target'] in (1, 2):
                      assert exp.config.training_total_area_range[0] - 1e-4 <= controls['area_factor'] <= exp.config.training_total_area_range[1] + 1e-4
                      assert exp.config.signal_energy_min - 1e-4 <= controls['signal_energy'] <= exp.config.signal_energy_max + 1e-4
                  if controls.get('close_spacing_sampled'):
                      seen_close = True
                  if result['target'] == 2 and controls.get('gain_ratio') is not None:
                      ratios.append(float(controls['gain_ratio']))
              assert ratios, profile
              assert seen_close, profile
              phase_ratios[profile] = float(np.median(ratios))

          assert phase_ratios['train_brightness_weak'] < phase_ratios['train_brightness_medium']
          assert phase_ratios['train_brightness_medium'] < phase_ratios['train_brightness_strong']

          before_w = exp.w_output.copy()
          before_b = exp.output_bias.copy()
          expected = {
              'position_only': (True, False, False, False),
              'brightness_only': (False, False, False, True),
              'combined': (True, True, True, True),
          }
          for profile in STAGE22D_PROFILES:
              seen_nonzero = False
              for _ in range(60):
                  result = exp.step(
                      trial,
                      learn=False,
                      trial_kind='stage22d_ood_eval',
                      stimulus_profile=profile,
                  )
                  trial += 1
                  assert result['learning_enabled'] is False
                  assert result['plasticity']['active_synapses'] == 0
                  controls = result['stimulus']['controls']
                  flags = (
                      controls['fractional_position'],
                      controls['novel_area'],
                      controls['close_spacing'],
                      controls['strong_brightness'],
                  )
                  assert flags == expected[profile], (profile, flags)
                  if result['target'] in (1, 2):
                      seen_nonzero = True
                      assert exp.config.signal_energy_min - 1e-4 <= controls['signal_energy'] <= exp.config.signal_energy_max + 1e-4
              assert seen_nonzero, profile
              assert np.array_equal(before_w, exp.w_output), f'{profile} changed output weights'
              assert np.array_equal(before_b, exp.output_bias), f'{profile} changed output bias'

          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'checkpoint.npz'
              exp.save_checkpoint(path, {'trial': trial, 'curriculum': 'stage2.2d'})
              restored = Stage22DExperiment()
              meta = restored.load_checkpoint(path)
              assert meta['trial'] == trial
              assert meta['curriculum'] == 'stage2.2d'
              assert np.array_equal(exp.w_input, restored.w_input)
              assert np.array_equal(exp.w_output, restored.w_output)
              assert np.array_equal(exp.output_bias, restored.output_bias)

          config = exp.config_dict()
          assert config['substage'] == '2.2D_progressive_brightness_curriculum'
          assert config['stage_2_2d_training']['phase_boundaries'] == [20000, 40000, 60000]
          assert config['visual_encoder']['explicit_object_counter'] is False
          assert config['visual_encoder']['explicit_peak_counter'] is False
          assert config['visual_encoder']['explicit_numerosity_feature'] is False
          print('Stage 2.2D curriculum/frozen OOD smoke test passed', phase_ratios)
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
