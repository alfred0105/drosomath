name: DrosoMath CI

on:
  push:
    branches:
      - main
      - bootstrap/realtime-3d
    paths-ignore:
      - 'runs/**'

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse run.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\run.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "run.ps1 syntax OK"
      - name: Run launcher self-test
        shell: powershell
        run: .\run.ps1 -SelfTest

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Import active FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Stage 3S.1 recurrent symbolic arithmetic smoke test
        working-directory: backend
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np
          from app.symbolic_stage3s1 import (
              ADDITION_COMMUTATIVITY_PAIRS,
              ADDITION_HELD_OUT_PAIRS,
              ADDITION_TRAIN_PAIRS,
              N_OUTPUTS,
              SymbolicStage3S1Experiment,
          )

          exp = SymbolicStage3S1Experiment()
          cfg = exp.config_dict()
          enc = cfg['token_encoding']
          assert cfg['stage'] == '3S.1'
          assert enc['scalar_number_value_injected'] is False
          assert enc['ordinal_embedding_injected'] is False
          assert enc['sum_feature_injected'] is False
          assert enc['commutativity_feature_injected'] is False
          assert enc['distance_to_answer_injected'] is False
          assert cfg['action_gating']['identity_successor_active_outputs'] == list(range(10))
          assert cfg['action_gating']['addition_active_outputs'] == list(range(19))
          assert {a + b for a, b in ADDITION_TRAIN_PAIRS} == set(range(N_OUTPUTS))

          # Same token code is reused regardless of sequence position. Identity
          # and successor can only choose 0..9, so 10..18 are never negatively
          # selected by those tasks.
          before_token = exp.w_token.copy()
          before_rec = exp.w_rec.copy()
          before_hi_bias = exp.output_bias[10:].copy()
          trial = 1
          for task in ('identity', 'successor'):
              for _ in range(80):
                  result = exp.step(trial, task=task)
                  trial += 1
                  assert result['active_output_count'] == 10
                  assert result['choice'] < 10
                  assert result['policy']['target_probability'] >= 0.0
                  assert result['plasticity']['internal_active_synapses'] > 0
          assert not np.array_equal(before_token, exp.w_token)
          assert not np.array_equal(before_rec, exp.w_rec)
          assert np.array_equal(before_hi_bias, exp.output_bias[10:])

          # Addition opens all 19 outputs and keeps the strict held-out split.
          before_hi = exp.w_output[10:].copy()
          for _ in range(120):
              result = exp.step(trial, task='addition', pair_pool=ADDITION_TRAIN_PAIRS)
              trial += 1
              assert result['active_output_count'] == 19
              assert len(result['policy']['top']) == 5
              assert result['plasticity']['internal_active_synapses'] > 0
          assert not np.array_equal(before_hi, exp.w_output[10:])

          train_unordered = {tuple(sorted(pair)) for pair in ADDITION_TRAIN_PAIRS}
          held_unordered = {tuple(sorted(pair)) for pair in ADDITION_HELD_OUT_PAIRS}
          comm_unordered = {tuple(sorted(pair)) for pair in ADDITION_COMMUTATIVITY_PAIRS}
          assert train_unordered.isdisjoint(held_unordered)
          assert comm_unordered.issubset(train_unordered)

          before = (
              exp.w_token.copy(), exp.w_rec.copy(), exp.w_output.copy(), exp.output_bias.copy()
          )
          for pool in (ADDITION_TRAIN_PAIRS, ADDITION_COMMUTATIVITY_PAIRS, ADDITION_HELD_OUT_PAIRS):
              for a, b in pool[:8]:
                  result = exp.step(trial, task='addition', a=a, b=b, learn=False, trial_kind='frozen')
                  trial += 1
                  assert result['learning_enabled'] is False
                  assert result['target'] == a + b
                  assert result['plasticity']['active_synapses'] == 0
          assert np.array_equal(before[0], exp.w_token)
          assert np.array_equal(before[1], exp.w_rec)
          assert np.array_equal(before[2], exp.w_output)
          assert np.array_equal(before[3], exp.output_bias)

          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / 'stage3s1.npz'
              exp.save_checkpoint(path, {'trial': trial, 'stage': '3S.1'})
              restored = SymbolicStage3S1Experiment()
              meta = restored.load_checkpoint(path)
              assert meta['trial'] == trial
              assert meta['stage'] == '3S.1'
              assert np.array_equal(exp.w_token, restored.w_token)
              assert np.array_equal(exp.w_rec, restored.w_rec)
              assert np.array_equal(exp.w_output, restored.w_output)
              assert np.array_equal(exp.output_bias, restored.output_bias)

          print('Stage 3S.1 recurrent symbolic arithmetic smoke test passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
