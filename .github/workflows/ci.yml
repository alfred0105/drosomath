name: DrosoMath CI

on:
  push:
    branches:
      - main
      - bootstrap/realtime-3d
    paths-ignore:
      - 'runs/**'
  pull_request:
    paths-ignore:
      - 'runs/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Stage 2 numerosity smoke test
        working-directory: backend
        run: |
          python - <<'PY'
          import math
          import numpy as np
          from app.numerosity import NumerosityExperiment

          exp = NumerosityExperiment()
          for trial in range(1, 101):
              result = exp.step(trial)
              assert result['target'] in (0, 1, 2)
              assert result['choice'] in (0, 1, 2)
              p = result['policy']
              total = p['p0'] + p['p1'] + p['p2']
              assert math.isclose(total, 1.0, abs_tol=2e-4), total
              assert result['stimulus']['numerosity'] == result['target']
              controls = result['stimulus']['controls']
              if result['target'] in (1, 2):
                  assert math.isclose(controls['area_factor'], exp.config.total_area_factor, abs_tol=2e-4)
                  assert exp.config.signal_energy_min - 1e-4 <= controls['signal_energy'] <= exp.config.signal_energy_max + 1e-4

          before = exp.w_output.copy()
          probe = exp.step(101, learn=False, trial_kind='probe')
          assert probe['trial_kind'] == 'probe'
          assert probe['learning_enabled'] is False
          assert probe['plasticity']['active_synapses'] == 0
          assert np.array_equal(before, exp.w_output), 'probe trial changed plastic weights'
          print('Stage 2 numerosity smoke test passed')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
